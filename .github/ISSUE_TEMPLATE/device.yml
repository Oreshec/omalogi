name: Support for another mouse
description: Ask for a Logitech mouse Omalogi does not support yet.
labels: [device]
body:
  - type: markdown
    attributes:
      value: Omalogi only writes to layouts verified on a real device, so a new mouse needs someone who owns it to run a few read-only checks.
  - type: input
    id: model
    attributes:
      label: Mouse model
      placeholder: Logitech G305
    validations:
      required: true
  - type: input
    id: usb
    attributes:
      label: USB id
      description: "From `lsusb | grep -i logitech`, e.g. 046d:c099."
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection
      options:
        - Wired
        - LIGHTSPEED receiver
        - Bluetooth
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Firmware
      description: "The firmware line from `omalogi info`, e.g. U1 60.00.B0009."
  - type: textarea
    id: results
    attributes:
      label: How did it go?
      description: For an untested mouse Omalogi already opens, what worked, what did not, and any error messages. Do not attach backups; they contain the mouse's unit ID.
      placeholder: |
        Reading profiles: …
        Changing DPI levels: …
        Button assignments: …
  - type: checkboxes
    id: testing
    attributes:
      label: Testing
      options:
        - label: I can run read-only checks on this mouse and share the results.
