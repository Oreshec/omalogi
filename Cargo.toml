[package]
name = "omalogi"
version = "0.3.1"
edition = "2024"
rust-version = "1.98"
description = "Configure Logitech G-series mice on Omarchy"
license = "MIT OR Apache-2.0"
repository = "https://github.com/elberacasa/omalogi"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
libc = "0.2.189"
openlogi-core = "=0.8.3"
openlogi-hid = "=0.8.3"
openlogi-hidpp = "=0.8.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt", "net", "time", "io-util", "io-std", "signal", "macros"] }
toml = "1.1.6"
ureq = "3.4.2"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt", "sync"] }
