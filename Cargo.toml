[package]
name = "omalogi"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Configure Logitech G-series mice on Omarchy"
license = "MIT OR Apache-2.0"
repository = "https://github.com/elberacasa/omalogi"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
libc = "0.2.189"
openlogi-hidpp = "=0.8.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt", "net", "time"] }
